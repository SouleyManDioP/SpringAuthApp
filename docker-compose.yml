version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: keycloak-inscription
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data: